name: Level 5 Verification

on:
  push:
    branches:
      - main
      - level-5-upgrade

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    level-5-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  verify:
    name: Verify contracts, backend and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt

      - name: Run Level 5 verification
        shell: pwsh
        run: |
          ./scripts/verify-level5.ps1
