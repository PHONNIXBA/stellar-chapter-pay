[package]
name = "chapter-token"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soroban utility token used for chapter payments"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }