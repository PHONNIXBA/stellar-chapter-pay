[package]
name = "chapter-payment"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soroban payment contract for unlocking digital chapters with Chapter Coin"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }